# docker-compose.yaml

services:
  qdrant:
    # Sử dụng image chính thức mới nhất từ Docker Hub
    image: qdrant/qdrant:latest
    
    # Đặt tên container dễ nhận biết
    container_name: qdrant_instance
    
    # Đảm bảo dịch vụ tự động khởi động lại nếu gặp sự cố
    restart: always
    
    # Ánh xạ các cổng từ container ra máy host của bạn
    ports:
      # Cổng REST API và Web UI
      - "6333:6333"
      # Cổng gRPC (tùy chọn, cho hiệu suất cao hơn)
      - "6334:6334"
    
    # Duy trì dữ liệu bền vững bằng cách liên kết thư mục local với storage của container
    volumes:
      # Dữ liệu sẽ được lưu trong thư mục './qdrant_data' trên máy host
      - ./qdrant_data:/qdrant/storage
